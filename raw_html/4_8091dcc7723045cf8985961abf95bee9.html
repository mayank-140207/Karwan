<body class="bg-background text-on-background min-h-screen">
<main class="flex min-h-screen">
<!-- Left Panel: Navy Brand Section -->
<div class="hidden lg:flex lg:w-1/2 relative bg-primary-container items-center justify-center overflow-hidden">
<div class="absolute inset-0 w-full h-full bg-cover bg-center" style="background-image: url(&quot;https://lh3.googleusercontent.com/aida/AEtjO1V0vupePwskolCgzGLUvZGtjIRsHVsBAvow38wAqgW7YyHqFbFEr3xpvDGdaUytyAaf_24j1s2xcuJCluwomCN-zjcfKTxgPwVrF2ry5JWgo7DnrTYO7KB-ppLx__eYI9MlET4nsVC8d0ZaNd24w6FO_Pm8AOYvvTdn0vZBCRIVWBAxetrV9CYkY83vgB0PM3xfQJVqw1-5njI7IaKEDIDg6tWMvt0dHntyWYXADDAbSccDKeHCs-h29hfX&quot;);"></div>
<div class="absolute inset-0 bg-gradient-to-t from-primary/90 via-primary/40 to-transparent"></div>
<div class="relative z-10 p-16 text-left flex flex-col h-full w-full justify-end">

<div class="max-w-md">
<h2 class="serif-font text-5xl text-pure-white mb-6 leading-tight font-black">
                        Embark on your journey with Karwan.
                    </h2>
<p class="text-xl text-pure-white/90">
                        Connect with the largest community of explorers and professionals worldwide.
                    </p>
</div>
</div>
</div>
<!-- Right Panel: White Form Section -->
<div class="w-full lg:w-1/2 flex flex-col items-center justify-center bg-surface-container-lowest px-6 lg:px-24">
<div class="w-full max-w-[480px]">
<!-- Minimal Back Header -->
<button class="mb-12 group flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="arrow_back">arrow_back</span>
<span class="text-sm font-medium">Back</span>
</button>
<!-- Login Header -->
<div class="mb-10">
<h1 class="text-on-surface serif-font text-4xl font-black mb-2">Log in to Karwan.</h1>
<p class="text-on-surface-variant">Welcome back to the community.</p>
</div>
<!-- Login Form -->
<form class="space-y-6" onsubmit="return false;">
<!-- Email/Username Field -->
<div class="space-y-2">
<label class="text-on-surface font-medium block">Email or Username</label>
<input class="w-full h-14 px-4 rounded-lg border border-outline-variant bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all placeholder:text-outline" placeholder="Enter your email or username" type="text">
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="text-on-surface font-medium block">Password</label>
<div class="relative flex items-center">
<input class="w-full h-14 px-4 rounded-lg border border-outline-variant bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all placeholder:text-outline pr-12" id="password-field" placeholder="Enter your password" type="password">
<button class="absolute right-4 text-outline hover:text-on-surface-variant transition-colors" data-icon="visibility" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
<div class="flex justify-end">
<a class="text-success-green text-sm font-semibold hover:underline" href="#">Forgot password?</a>
</div>
</div>
<!-- Log In Button -->
<button class="w-full h-14 bg-success-green text-pure-white rounded-lg font-bold text-lg hover:opacity-90 active:scale-[0.98] transition-all shadow-md shadow-success-green/20">
                    Log In
                </button>
<!-- Divider -->
<div class="relative py-4 flex items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 text-outline text-sm uppercase tracking-widest font-medium">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Buttons -->
<div class="flex flex-col sm:flex-row gap-4">
<button class="flex-1 h-12 flex items-center justify-center gap-3 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors">

</button>

<span class="text-sm font-semibold">Apple</span>
</button>
</div>
</form>
<!-- Bottom Redirect -->
<div class="mt-12 text-center">
<p class="text-on-surface-variant text-sm">
                    New to Karwan? <a class="text-success-green font-bold hover:underline" href="#">Sign up</a>
</p>
</div>
</div>
</div>
</main>
<script>
    function togglePassword() {
        const passwordField = document.getElementById('password-field');
        const eyeIcon = document.getElementById('eye-icon');
        
        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            eyeIcon.textContent = 'visibility_off';
        } else {
            passwordField.type = 'password';
            eyeIcon.textContent = 'visibility';
        }
    }
</script>
</body></html>
